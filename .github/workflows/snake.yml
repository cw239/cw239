# Redraws the contribution graph as a snake eating the green squares, once a
# day, and publishes the animations to the `output` branch for the README.
name: Contribution snake

on:
  schedule:
    - cron: "0 18 * * *" # daily, 4-5am Australian east-coast time
  workflow_dispatch: # and on demand, from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Coral snake on the banner's purples; one for each GitHub theme.
          outputs: |
            dist/snake-dark.svg?color_snake=#E07A5F&color_dots=#161b22,#2b2361,#4b3bb0,#7a62f2,#c2b6ff
            dist/snake-light.svg?color_snake=#E07A5F&color_dots=#ebedf0,#d4caff,#a999f7,#7a62f2,#4b3bb0

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
