<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="cw239, with a spaceship flying through the stars">
  <style>
    .far{animation:drift 60s linear infinite}.near{animation:drift 25s linear infinite}
    .tw{animation:tw 2.4s ease-in-out infinite}.tw1{animation-duration:3.1s;animation-delay:-1s}.tw2{animation-duration:1.8s;animation-delay:-.5s}
    .fly{animation:fly 10s linear infinite}
    .wave{animation:wave 2s ease-in-out infinite}
    .trail{transform-box:fill-box;transform-origin:100% 50%;animation:trail .4s ease-in-out infinite}
    .glow{animation:glow .2s ease-in-out infinite}
    .nav{animation:blink 1.2s steps(1) infinite}.nav2{animation-delay:-.6s}
    @keyframes trail{50%{transform:scaleX(.8);opacity:.8}}
    @keyframes glow{50%{opacity:.6}}
    .cursor{animation:blink 1s steps(1) infinite}
    .shoot{animation:shoot 7s linear infinite;opacity:0}
    @keyframes drift{to{transform:translateX(-840px)}}
    @keyframes tw{50%{opacity:.2}}
    @keyframes fly{0%{transform:translateX(-120px)}100%{transform:translateX(880px)}}
    @keyframes wave{50%{transform:translateY(-8px)}}
    @keyframes flame{50%{transform:scaleX(.55)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes shoot{0%,78%{opacity:0;transform:translate(0,0)}80%{opacity:1}92%{opacity:0;transform:translate(-220px,90px)}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.far,.near,.tw,.fly,.wave,.trail,.glow,.nav,.cursor,.shoot{animation:none}.fly{transform:translateX(560px)}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6d5dfc" stop-opacity=".35"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset=".55" stop-color="#d5dce6"/><stop offset="1" stop-color="#8d99aa"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c3ccd8"/><stop offset="1" stop-color="#6b7789"/></linearGradient>
    <linearGradient id="wingLow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7b1bf"/><stop offset="1" stop-color="#4f5a6b"/></linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff0ff"/><stop offset=".5" stop-color="#2fb6e8"/><stop offset="1" stop-color="#14366b"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee6ff" stop-opacity="0"/><stop offset="1" stop-color="#5ee6ff" stop-opacity=".75"/></linearGradient>
    <filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="840" height="170" rx="14"/></clipPath>
  </defs>
