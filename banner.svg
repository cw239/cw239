<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="cw239, with a pixel spaceship flying through the stars">
  <style>
    .far{animation:drift 60s linear infinite}.near{animation:drift 25s linear infinite}
    .tw{animation:tw 2.4s ease-in-out infinite}.tw1{animation-duration:3.1s;animation-delay:-1s}.tw2{animation-duration:1.8s;animation-delay:-.5s}
    .fly{animation:fly 10s linear infinite}
    .wave{animation:wave 2s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:100% 50%;animation:flame .15s steps(1) infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .shoot{animation:shoot 7s linear infinite;opacity:0}
    @keyframes drift{to{transform:translateX(-840px)}}
    @keyframes tw{50%{opacity:.2}}
    @keyframes fly{0%{transform:translateX(-90px)}100%{transform:translateX(880px)}}
    @keyframes wave{50%{transform:translateY(-8px)}}
    @keyframes flame{50%{transform:scaleX(.55)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes shoot{0%,78%{opacity:0;transform:translate(0,0)}80%{opacity:1}92%{opacity:0;transform:translate(-220px,90px)}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.far,.near,.tw,.fly,.wave,.flame,.cursor,.shoot{animation:none}.fly{transform:translateX(560px)}}
  </style>
  <defs>
